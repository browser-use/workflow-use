[project]
name = "workflow-use"
version = "0.2.11"
authors = [{ name = "Gregor Zunic" }]
description = "Create, edit, run deterministic workflows"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiofiles==24.1.0",
    # Keep a patch range so pip can select the first browser-use release whose
    # own pins satisfy the security floors below. Vulnerable releases fail closed.
    "browser-use>=0.13.8,<0.14",
    "fastapi==0.139.2",
    "fastmcp==3.4.0",
    # starlette is transitive (via fastapi/fastmcp) but pinned directly so the
    # security floor lands in the published wheel's Requires-Dist, not just the
    # uv lockfile. Clears CVE-2025-62727 (<= 0.49.0) / CVE-2026-48818 (< 1.1.0)
    # / CVE-2026-54283 (< 1.3.1); requires fastapi>=0.139 (no upper starlette cap).
    "starlette==1.3.1",
    "typer==0.16.0",
    "uvicorn==0.35.0",
    "faiss-cpu==1.13.2",
    "pandas==2.3.0",
    "markdownify==1.2.2",
    "pyyaml==6.0.3",
    # Security floors are direct dependencies so they are included in the
    # published wheel's Requires-Dist metadata, not only the local uv lockfile.
    "authlib>=1.6.9",
    "urllib3>=2.7.0",
    "pyasn1>=0.6.3",
    "protobuf>=6.33.5,<7",
    "cryptography>=50.0.0",
    "soupsieve>=2.8.4",
    "idna>=3.15",
    "httplib2>=0.32.0",
    "pygments>=2.20.0",
    "aiohttp>=3.14.1",
    "pillow>=12.3.0",
    "mcp>=1.28.1,<2",
    "click>=8.3.3,<9",
    "pypdf>=6.15.0,<7",
]


[tool.uv]
dev-dependencies = [
    "build==1.2.2.post1",
    "ruff==0.11.12",
]
# Published browser-use 0.13.x releases still pin vulnerable Click, MCP, and
# pypdf versions. Keep local resolution patched while waiting for an upstream
# release that satisfies the direct security floors above.
override-dependencies = [
    # CVE-2026-52869 / CVE-2026-52870 / CVE-2026-59950 (< 1.28.1)
    "mcp>=1.28.1,<2",
    # PYSEC-2026-2132 (< 8.3.3)
    "click>=8.3.3,<9",
    # CVE-2026-48155 / CVE-2026-48156 / CVE-2026-48735 / CVE-2026-49460 /
    # CVE-2026-49461 / CVE-2026-54530 / CVE-2026-54531 / CVE-2026-54651 /
    # CVE-2026-59937 / CVE-2026-59938 / GHSA-jm82-fx9c-mx94
    "pypdf>=6.15.0,<7",
]

[tool.codespell]
ignore-words-list = "bu"
skip = "*.json,*.yaml,*.yml"

[tool.ruff]
line-length = 130
fix = true

[tool.ruff.lint]
select = ["ASYNC", "E", "F", "FAST", "I", "PLE"]
ignore = ["ASYNC109", "E101", "E402", "E501", "F841", "E731"]  # TODO: determine if adding timeouts to all the unbounded async functions is needed / worth-it so we can un-ignore ASYNC109
unfixable = ["E101", "E402", "E501", "F841", "E731"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "workflow_use/**/*.py",
    "workflow_use/**/*.md",
]

[tool.hatch.metadata]
allow-direct-references = true
